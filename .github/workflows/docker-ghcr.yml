name: Publish Docker image (GHCR and Docker Hub)

# Fork-specific build: pushes to ghcr.io/<owner>/new-api and Docker Hub.
# GHCR uses GITHUB_TOKEN; Docker Hub requires DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN repository secrets.
on:
  workflow_dispatch:
  push:
    branches:
      - v1.0
      - v1.1
      - v1.3
      - v1.4
      - 'feature/**'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api
  DOCKERHUB_IMAGE: docker.io/xjy94/new-api
  # Only this release branch may update :latest.
  LATEST_BRANCH: v1.3

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify video download flow (Linux)
    if: github.ref_type == 'branch' && (contains(fromJSON('["v1.0", "v1.1", "v1.3", "v1.4"]'), github.ref_name) || startsWith(github.ref_name, 'feature/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOWORK: 'off'
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Vet controllers, routes, and task plugins
        run: go vet ./controller ./router ./relay/channel/task/jsplugin

      - name: Test controllers, routes, and task plugins
        run: go test ./controller ./router ./relay/channel/task/jsplugin -count=1 -timeout=10m

  build:
    name: Build & push to GHCR and Docker Hub (amd64)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Save version info
        run: git describe --tags --always > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          sha="$(git rev-parse --short HEAD)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Keep :latest on the established release branch.
          {
            echo "tags<<TAGS_EOF"
            for image in "$IMAGE" "$DOCKERHUB_IMAGE"; do
              echo "${image}:${branch}"
              echo "${image}:${branch}-${sha}"
              if [ "${GITHUB_REF}" = "refs/heads/${LATEST_BRANCH}" ]; then
                echo "${image}:latest"
              fi
            done
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${TAGS}" >> "$GITHUB_STEP_SUMMARY"
          echo "${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
