name: Publish Docker image (GHCR fork build)

# Fork-specific build: pushes to ghcr.io/<owner>/new-api using the built-in
# GITHUB_TOKEN, so no extra registry secrets are required.
on:
  workflow_dispatch:
  push:
    branches:
      - v1.0
      - v1.1
      - v1.3

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save version info
        run: git describe --tags --always > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          sha="$(git rev-parse --short HEAD)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE}:${{ steps.meta.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE}:${{ steps.meta.outputs.branch }}-${{ steps.meta.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
