name: Publish Docker image (GHCR fork build)

# Fork-specific build: pushes to ghcr.io/<owner>/new-api using the built-in
# GITHUB_TOKEN, so no extra registry secrets are required.
on:
  workflow_dispatch:
  push:
    branches:
      - v1.0
      - v1.1
      - v1.3
      - v1.4

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/new-api
  # 只有这条分支的构建才会改写 :latest
  LATEST_BRANCH: v1.3

jobs:
  build:
    name: Build & push (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save version info
        run: git describe --tags --always > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          sha="$(git rev-parse --short HEAD)"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # 整份 tag 列表在这里拼好，避免给 build-push-action 传空行。
          # :latest 只跟随 LATEST_BRANCH，其它分支不得改写它——否则按 latest 拉的
          # 环境会在毫无预期的情况下切到另一条发布线。
          {
            echo "tags<<TAGS_EOF"
            echo "${IMAGE}:${branch}"
            echo "${IMAGE}:${branch}-${sha}"
            if [ "${GITHUB_REF_NAME}" = "${LATEST_BRANCH}" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${TAGS}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
